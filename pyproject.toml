[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clscraper"
version = "0.1.0"
description = "Census-block ISP competition (FCC NBM + Fabric) and Broadband Consumer Label (Unique Plan Identifier) scraper"
requires-python = ">=3.10"

[project.scripts]
cls = "clscraper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
